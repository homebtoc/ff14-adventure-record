<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2026年11月 第1週目</title>

<style>

body{

    background:#111;

    color:white;

    font-family:"Yu Gothic",sans-serif;

    text-align:center;

    margin:0;

    display:flex;

    flex-direction:column;

    align-items:center;

    min-height:100vh;
}

h1{

    margin:30px 0;
}

#image{

    width:auto;

    height:70vh;

    max-width:90vw;

    object-fit:contain;

    border-radius:10px;

    box-shadow:0 0 20px rgba(255,255,255,0.3);
}

#player{

    margin:20px 0;
}

.start{

    padding:20px 50px;

    font-size:1.5rem;

    cursor:pointer;
}

.back{

    display:inline-block;

    margin-top:30px;

    margin-bottom:30px;

    padding:15px 35px;

    background:white;

    color:black;

    text-decoration:none;

    border-radius:15px;

    font-size:1.1rem;

    font-weight:bold;

    box-shadow:0 0 10px rgba(255,255,255,0.2);

    transition:0.3s;
}

.back:hover{

    background:#ddd;

    color:black;

    transform:scale(1.05);
}

.back:visited{

    color:black;
}



</style>

</head>

<body>

<h1>2026年11月 第1週 料理集</h1>

<button id="startButton" class="start">

スタート

</button>

<br><br>

<img id="image" style="display:none;">

<br>

<audio id="player"></audio>

<br><br>

<a class="back" href="cooking-list.html">

料理一覧へ戻る

</a>

<script>

const slides = [

"001",
"002",
"003",
"004",
"005",
"006",
"007",
"008",
"009",
"010",
"011",
"012",
"013",
"014",
"015"

];

let current = 0;

const image =
document.getElementById("image");

const player =
document.getElementById("player");

const button =
document.getElementById("startButton");

button.addEventListener("click",startShow);

function startShow(){

    button.style.display = "none";

    showSlide();
}

function showSlide(){

    if(current >= slides.length){

        document.body.innerHTML +=
        "<h2>ご視聴ありがとうございました！</h2>";

        return;
    }

    const num = slides[current];

    image.style.display = "block";

    image.src =
    `album/cooking/2026-11-week1/${num}.JPG`;

    player.src =
    `album/cooking/2026-11-week1/${num}.mp3`;

    player.play();

    player.onended = function(){

        setTimeout(() => {

            current++;

            showSlide();

        },2000);

    };
}

</script>

</body>

</html>
