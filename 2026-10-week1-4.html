<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>2026年10月 第1～4週</title>

<style>

body{

    background:#111;

    color:white;

    font-family:"Yu Gothic",sans-serif;

    text-align:center;

    margin:0;
}

h1{

    margin:40px 0;
}

#gallery{

    display:flex;

    flex-direction:column;

    align-items:center;
}

#gallery img{

    width:90%;

    max-width:1400px;

    margin-bottom:30px;

    border-radius:10px;

    box-shadow:0 0 15px rgba(255,255,255,0.3);
}

.back{

    display:inline-block;

    margin:50px;

    padding:20px 40px;

    background:white;

    color:black;

    text-decoration:none;

    border-radius:15px;

    font-size:1.2rem;

    font-weight:bold;
}

.back:hover{

    background:#ddd;
}

</style>

</head>

<body>

<h1>2026年10月 第1～4週</h1>

<div id="gallery"></div>

<a class="back" href="screenshot-list.html">

一覧へ戻る

</a>

<script>

const gallery = document.getElementById("gallery");

/*
将来的な余裕を持たせる
*/

for(let i = 1; i <= 150; i++){

    const number = String(i).padStart(3,'0');

    const img = document.createElement("img");

    /*
    まず png を探す
    */
    img.src =
    `album/2026-10-week1-4/${number}.png`;

    img.loading = "lazy";

    /*
    png が無ければ jpg を探す
    */
    img.onerror = function(){

        if(!this.dataset.jpgTried){

            this.dataset.jpgTried = "true";

            this.src =
            `album/2026-10-week1-4/${number}.JPG`;

        }else{

            this.remove();

        }

    };

    gallery.appendChild(img);
}

</script>

</body>

</html>
